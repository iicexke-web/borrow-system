<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Borrow &amp; Return System</title>
<style>
/* ==========================================================================
   DESIGN TOKENS
   ========================================================================== */
:root{
  --bg:#f4f6fb;
  --card:#ffffff;
  --ink:#1d2333;
  --muted:#6d7589;
  --line:#e6e9f1;
  --brand:#4f46e5;
  --brand-2:#7c3aed;
  --brand-soft:#eef2ff;
  --ok:#15803d;      --ok-soft:#dcfce7;
  --warn:#b45309;    --warn-soft:#fef3c7;
  --bad:#b91c1c;     --bad-soft:#fee2e2;
  --info:#1d4ed8;    --info-soft:#dbeafe;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 28px rgba(16,24,40,.05);
  --font:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

/* ==========================================================================
   LAYOUT
   ========================================================================== */
.app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:0 0 236px;position:fixed;inset:0 auto 0 0;z-index:30;
  background:var(--card);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 20px}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.28)}
.brand-mark svg{width:21px;height:21px}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--muted)}
.nav-label{font-size:10px;font-weight:700;color:#9aa1b1;letter-spacing:1px;padding:12px 12px 6px;text-transform:uppercase}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#545c70;font-weight:600;transition:.16s}
.nav-link:hover{background:#f6f7fb;color:var(--ink)}
.nav-link.active{background:var(--brand-soft);color:var(--brand)}
.nav-link svg{width:18px;height:18px;flex:none}
.nav-link .pill{margin-left:auto;background:#eef0f5;color:#6d7589;border-radius:99px;font-size:10px;padding:1px 7px;font-weight:700}
.nav-link.active .pill{background:#dfe4ff;color:var(--brand)}
.side-foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}

.main-wrap{margin-left:236px;flex:1;min-width:0}
.topbar{
  height:68px;position:sticky;top:0;z-index:20;padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.top-title{font-size:15px;font-weight:700;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.field-compact{display:flex;align-items:center;gap:7px;background:#f6f7fb;border:1px solid var(--line);border-radius:10px;padding:5px 9px}
.field-compact label{font-size:11px;color:var(--muted);white-space:nowrap}
.field-compact input,.field-compact select{border:0;background:transparent;outline:0;color:var(--ink);font-weight:600;max-width:150px}
.field-compact input{width:130px}
main#view{padding:26px 28px 70px;max-width:1440px;margin:0 auto}
.mobile-nav{display:none}

/* ==========================================================================
   SHARED COMPONENTS
   ========================================================================== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:750;letter-spacing:-.4px;margin:0}
.page-desc{color:var(--muted);font-size:13px;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line)}
.card-title{font-size:14px;font-weight:700;margin:0}
.card-sub{font-size:11px;color:var(--muted);margin:2px 0 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.strong{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty svg{width:32px;height:32px;opacity:.4;margin-bottom:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:#f7f8fc;border-color:#d6dae5}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.2)}
.btn.primary:hover{background:#4338ca}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#166534}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f2f4f9;color:var(--ink)}
.btn.danger{color:var(--bad);border-color:#f3cccc;background:#fff5f5}
.btn.danger:hover{background:#fee2e2}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.icon{padding:7px;border-radius:8px}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.available{background:var(--ok-soft);color:var(--ok)}
.badge.borrowed{background:var(--info-soft);color:var(--info)}
.badge.unavailable{background:#f1f3f7;color:#6b7280}
.badge.active{background:var(--info-soft);color:var(--info)}
.badge.overdue{background:var(--bad-soft);color:var(--bad)}
.badge.returned{background:var(--ok-soft);color:var(--ok)}
.badge.soon{background:var(--warn-soft);color:var(--warn)}
.badge.scheduled{background:var(--brand-soft);color:var(--brand)}

.input,select.input,textarea.input{
  width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:8px 11px;outline:0;transition:.15s;color:var(--ink)
}
.input:focus{border-color:#a5b4fc;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
textarea.input{min-height:74px;resize:vertical}
label.lbl{display:block;font-size:12px;font-weight:600;color:#4b5563;margin-bottom:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 22px;border-top:1px solid var(--line);margin-top:6px}

/* ==========================================================================
   DASHBOARD
   ========================================================================== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px 19px;position:relative;overflow:hidden}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.kpi-ico svg{width:18px;height:18px}
.kpi-num{font-size:29px;font-weight:750;letter-spacing:-1px;margin-top:12px;line-height:1.1}
.kpi-label{font-size:12px;color:var(--muted);margin-top:3px}
.kpi-foot{font-size:11px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.kpi.a .kpi-ico{background:var(--brand-soft);color:var(--brand)}
.kpi.b .kpi-ico{background:var(--info-soft);color:var(--info)}
.kpi.c .kpi-ico{background:var(--ok-soft);color:var(--ok)}
.kpi.d .kpi-ico{background:var(--bad-soft);color:var(--bad)}
.dash-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:16px}
.bar-row{display:grid;grid-template-columns:130px 1fr 34px;gap:12px;align-items:center;padding:7px 0}
.bar-name{font-size:12px;color:#4b5563;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:9px;background:#eef0f6;border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.bar-val{font-size:12px;font-weight:700;text-align:right}
.mini-stat{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.mini-stat:last-child{border:0}
.alert-item{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)}
.alert-item:last-child{border-bottom:0}
.alert-dot{width:9px;height:9px;border-radius:50%;flex:none}
.alert-main{flex:1;min-width:0}
.alert-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert-meta{font-size:11px;color:var(--muted);margin-top:2px}
.alert-actions{display:flex;gap:6px;flex:none}

/* ==========================================================================
   ITEMS / TABLES
   ========================================================================== */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.search-box{position:relative;flex:1;min-width:200px}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#9aa1b1}
.search-box input{padding-left:34px}
.toolbar select.input{width:auto;min-width:140px}
.items-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pager{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:20px}
.pager .btn{min-width:34px;padding:6px 10px}
.pager .current{background:var(--brand-soft);border-color:#dfe4ff;color:var(--brand)}
.pager .info{font-size:12px;color:var(--muted);margin:0 6px}
.item-card{padding:17px;display:flex;flex-direction:column;gap:12px;transition:.18s}
.item-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(16,24,40,.09);border-color:#d8dce8}
.item-ico{width:42px;height:42px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.item-ico svg{width:21px;height:21px}
.item-name{font-weight:700;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-cat{font-size:11px;color:var(--muted);margin-top:2px}
.item-qty{font-size:12px;color:#4b5563}
.item-qty b{color:var(--ink)}
.item-foot{display:flex;gap:7px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.item-foot .btn{flex:1}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:660px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#8b93a4;font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafbfe;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid #f0f2f7;font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbff}
.tabs{display:inline-flex;background:#eef0f6;border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted)}
.tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(16,24,40,.1)}

/* STORAGE LAYOUT */
.sheet-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sheet-tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;text-align:left;transition:.15s}
.sheet-tab:hover{border-color:#c7cdda;background:#fafbff}
.sheet-tab.active{border-color:var(--brand);background:var(--brand-soft)}
.sheet-tab .sheet-no{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#eef0f6;color:var(--muted);font-size:11px;font-weight:700;flex:none}
.sheet-tab.active .sheet-no{background:#fff;color:var(--brand)}
.sheet-tab .sheet-name{font-size:12px;font-weight:700;line-height:1.2}
.sheet-tab .sheet-meta{font-size:10px;color:var(--muted);margin-top:2px}
.layout-location{margin-bottom:14px;overflow:hidden}
.layout-loc-head{display:flex;align-items:center;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line);background:#fafbfe}
.loc-pin{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.loc-pin svg{width:16px;height:16px}
.layout-loc-name{font-weight:700;font-size:13px}
.layout-loc-meta{font-size:11px;color:var(--muted);margin-top:1px}
.layout-entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:10px;padding:15px}
.layout-entry{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;transition:.15s}
.layout-entry:hover{border-color:#cfd5e3;background:#fcfcff}
.layout-part{font-size:10px;font-weight:700;color:var(--brand);letter-spacing:.2px;text-transform:uppercase}
.layout-desc{font-size:12px;font-weight:600;line-height:1.35;margin-top:4px}
.layout-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.layout-chip{font-size:10px;background:#f1f3f8;border-radius:6px;padding:2px 7px;color:#596175;font-weight:600}
.layout-chip.serial{background:var(--info-soft);color:var(--info)}
.layout-chip.match{background:var(--ok-soft);color:var(--ok)}
.layout-chip.noQty{background:var(--warn-soft);color:var(--warn)}

/* ==========================================================================
   MODAL / TOAST
   ========================================================================== */
.backdrop{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:min(540px,100%);max-height:min(90vh,820px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(15,23,42,.25);animation:rise .18s ease}
@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{padding:19px 22px;border-bottom:1px solid var(--line)}
.modal-title{font-size:16px;font-weight:750;margin:0}
.modal-body{padding:20px 22px;overflow:auto}
#toast-root{position:fixed;top:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:calc(100vw - 36px)}
.toast{background:#1d2333;color:#fff;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(15,23,42,.25);animation:slide .2s ease;display:flex;align-items:center;gap:9px}
.toast.ok{background:#166534}.toast.bad{background:#b91c1c}.toast.warn{background:#b45309}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.detail-list{display:grid;grid-template-columns:130px 1fr;gap:9px 12px;font-size:13px}
.detail-list dt{color:var(--muted)}
.detail-list dd{margin:0;font-weight:600;word-break:break-word}
.detail-list dd a{color:var(--brand);text-decoration:underline}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-width:900px){
  .items-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .layout-entries{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
@media (max-width:1080px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .sidebar{display:none}
  .main-wrap{margin-left:0}
  .topbar{height:auto;min-height:60px;padding:10px 16px;flex-wrap:wrap}
  .top-title{font-size:14px}
  main#view{padding:18px 16px 96px}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(16,24,40,.06)
  }
  .mobile-nav .nav-link{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:10px;border-radius:9px;text-align:center}
  .mobile-nav .nav-link svg{width:19px;height:19px}
  .mobile-nav .nav-link .pill{display:none}
  .field-compact input{width:100px}
}
@media (max-width:560px){
  .items-grid{grid-template-columns:1fr}
  .layout-entries{grid-template-columns:1fr}
  .kpi-grid{gap:10px}
  .kpi{padding:14px}
  .kpi-num{font-size:23px}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:auto}
  .bar-row{grid-template-columns:96px 1fr 28px;gap:8px}
  .alert-item{flex-wrap:wrap}
  .alert-actions{width:100%}
  .alert-actions .btn{flex:1}
  .page-title{font-size:19px}
}
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M3 9v6l9 5 9-5V9"/><path d="M12 14v6"/></svg></div>
      <div><div class="brand-name">Borrow &amp; Return</div><div class="brand-sub">Asset Lending Dashboard</div></div>
    </div>
    <div class="nav-label">Main menu</div>
    <a href="#dashboard" class="nav-link" data-nav="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
    <a href="#items" class="nav-link" data-nav="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M3 9v6l9 5 9-5V9"/></svg>Borrow &amp; Return <span class="pill" id="nav-item-count"></span></a>
    <a href="#inventory" class="nav-link" data-nav="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg>Inventory &amp; History</a>
    <a href="#layout" class="nav-link" data-nav="layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-12a7 7 0 10-14 0c0 6.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Storage Layout</a>
    <div class="side-foot">Data loaded from the RF equipment workbook.<br />Stored locally in this browser.</div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="top-title" id="page-title">Dashboard</div>
      <div class="top-actions">
        <div class="field-compact"><label for="user-name">User</label><input id="user-name" type="text" placeholder="Your name" /></div>
        <div class="field-compact"><label for="role-select">Role</label><select id="role-select"><option value="borrower">Borrower</option><option value="admin">Admin</option></select></div>
        <button class="btn sm" data-action="import-csv" title="Import data from a CSV file">Import CSV</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>

<nav class="mobile-nav">
  <a href="#dashboard" class="nav-link" data-nav="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</a>
  <a href="#items" class="nav-link" data-nav="items"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M3 9v6l9 5 9-5V9"/></svg>Borrow / Return</a>
  <a href="#inventory" class="nav-link" data-nav="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/><circle cx="19" cy="17" r="2"/></svg>Inventory</a>
  <a href="#layout" class="nav-link" data-nav="layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-12a7 7 0 10-14 0c0 6.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Layout</a>

const isNA = (v) => { const s = String(v ?? '').trim(); return !s || /^(n\s*\/?\s*a|na|-)$/i.test(s); };
const displayName = (item) => {
  if(!item) return '';

  return item.name || 'Unnamed item';
};

};

const isoDate = (d) => [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
const todayISO = () => isoDate(new Date());
const dOff = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return isoDate(d); };
const parseISO = (s) => { if(!s) return null; const d = new Date(s + 'T00:00:00'); return isNaN(d) ? null : d; };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const fmtDate = (s) => { const d = parseISO(s); return d ? d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '—'; };
/* Excel writes long numeric S/Ns as "2.1322574E7". Expand them without losing
   digits (string shift, not float maths). Alphanumeric IDs such as 3E349 are kept. */
function expandSci(v){
  const s = String(v ?? '').trim();
  const m = s.match(/^([+-]?)(\d+(?:\.\d+)?)[Ee]([+-]?\d+)$/);
  if(m){
    const exp = parseInt(m[3],10);
    if(exp >= 1 && exp <= 20){
      const parts = m[2].split('.');
      const digits = parts[0] + (parts[1] || '');
      const pos = parts[0].length + exp;
      const full = pos >= digits.length ? digits + '0'.repeat(pos - digits.length) : digits.slice(0,pos);
      return m[1] + full;
    }
  }
  return s.replace(/^(\d+)\.0+$/, '$1');
}

function dueLabel(tx){
  if (tx.returnDate) return 'Returned ' + fmtDate(tx.returnDate);
  const n = diffDays(tx.dueDate, todayISO());
  if (n < 0)  return Math.abs(n) + ' day(s) overdue';
  if (n === 0) return 'Due today';
  if (n === 1) return 'Due tomorrow';
  return 'Due in ' + n + ' days';
}
function txStatus(tx){
  if (tx.returnDate) return 'returned';
  if (tx.dueDate && diffDays(tx.dueDate, todayISO()) < 0) return 'overdue';
  const n = tx.dueDate ? diffDays(tx.dueDate, todayISO()) : 99;
  return n <= DUE_SOON_DAYS ? 'soon' : 'active';
}
function itemStatus(item){
  if (!item.enabled) return 'unavailable';
  return ((item.quantity||0) - (item.available||0)) > 0 ? 'borrowed' : 'available';
}
function calStatus(item){
  if (!item.nextCal) return null;
  const n = diffDays(item.nextCal, todayISO());
  if (n < 0) return 'overdue';
  if (n <= CAL_SOON_DAYS) return 'soon';
  return 'scheduled';
}
function badge(key, text){
  const s = STATUS[key] || {label:key, cls:''};
  return '<span class="badge ' + s.cls + '">' + esc(text || s.label) + '</span>';
}
function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transform='translateX(16px)'; setTimeout(()=>el.remove(),220); }, 2800);
}

  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  empty:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M3 9v6l9 5 9-5V9"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>'

/* ==========================================================================
   2. DATA LAYER  (swap this object for a real API later)
   ========================================================================== */
function seedState(){
  return {
    items: JSON.parse(JSON.stringify(EXCEL_EQUIPMENT)).map(i => ({
      ...i,
      sku: expandSci(i.sku), serial: expandSci(i.serial), certNo: expandSci(i.certNo),
      quantity: Number(i.quantity) || 1,
      available: Number.isFinite(Number(i.available)) ? Number(i.available) : (Number(i.quantity) || 1),
      enabled: i.enabled !== false
    })),
    transactions: [],
    role: 'borrower',
    userName: 'Guest User',
    invTab: 'items',
    filters: {}
  };
}

const DataLayer = {
  KEY:'asset-lend-rf.v1',

  load(){
    try{
      const raw = localStorage.getItem(this.KEY);
      if(raw){
        const s = JSON.parse(raw);
        if(Array.isArray(s.items) && Array.isArray(s.transactions)) return s;
      }
    }catch(e){ console.warn('load failed', e); }
    return seedState();
  },
  save(state){
    try{ localStorage.setItem(this.KEY, JSON.stringify(state)); }
    catch(e){ console.warn('save failed', e); }
  },

  parseCSV(text){
    text = String(text || '').replace(/^\uFEFF/,'');
    const head = text.split(/\r?\n/)[0] || '';
    const delim = [',',';','\t'].sort((a,b)=> (head.split(b).length - head.split(a).length))[0];
    const rows=[]; let row=[], field='', quoted=false;
    for(let i=0;i<text.length;i++){
      const c = text[i];
      if(quoted){
        if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else quoted=false; }
        else field += c;
      }else{
        if(c === '"') quoted = true;
        else if(c === delim){ row.push(field.trim()); field=''; }
        else if(c === '\n'){ row.push(field.trim()); field=''; if(row.some(v=>v!=='')) rows.push(row); row=[]; }
        else if(c !== '\r') field += c;
      }
    }
    row.push(field.trim());
    if(row.some(v=>v!=='')) rows.push(row);
    return rows;
  },
  normalize(s){ return String(s||'').toLowerCase().replace(/[\s_\-./()]/g,''); },
  pick(row, aliases){
    const keys = Object.keys(row);
    for(const a of aliases){
      const target = this.normalize(a);
      const hit = keys.find(k => this.normalize(k) === target);
      if(hit !== undefined && row[hit] !== '') return row[hit];
    }
    return '';
  },
  toDate(v){
    v = String(v||'').trim();
    if(!v) return '';
    if(/^\d+(\.\d+)?$/.test(v)){
      return isoDate(new Date(Date.UTC(1899,11,30) + Number(v)*86400000));
    }
    let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
    m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);
    if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
    return v;
  },
  toBool(v, def=true){
    const s = this.normalize(v);
    if(!s) return def;
    if(['false','0','no','off','disabled','unavailable'].includes(s)) return false;
    return true;
  },

  /* Rows with a date become loans; the rest become inventory items. */
  importCSV(text){
    const rows = this.parseCSV(text);
    if(rows.length < 2) return {items:0, txs:0};
    const head = rows[0];
    const objRows = rows.slice(1).map(cells => {
      const o = {};
      head.forEach((h,i)=> o[h] = cells[i] || '');
      return o;
    });
    const items=[], txs=[];
    objRows.forEach(r=>{
      const borrowDate = this.toDate(this.pick(r,['borrow date','borrowed date','borrowdate','date borrowed']));
      const dueDate    = this.toDate(this.pick(r,['due date','returndue','duedate','date due']));
      if(borrowDate || dueDate){
        txs.push({
          id:uid('t'), itemId:'',
          itemName: this.pick(r,['item','item name','asset','equipment']) || 'Imported item',
          borrower: this.pick(r,['borrower','user','who']) || 'Unknown',
          qty: Math.max(1, parseInt(this.pick(r,['qty','quantity','amount']),10) || 1),
          borrowDate: borrowDate || dueDate || todayISO(),
          dueDate: dueDate || borrowDate || todayISO(),
          returnDate: this.toDate(this.pick(r,['return date','returned date','returndate'])) || null,
          condition: this.pick(r,['condition']),
          notes: this.pick(r,['notes','note','remark'])
        });
      }else{
        const desc = this.pick(r,['description','detail']);
        const rawName = this.pick(r,['name','item name','equipment name','equipment','item']);
        const name = isNA(rawName) && !isNA(desc) ? desc : (rawName || desc);
        if(!name) return;
        const quantity = Math.max(1, parseInt(this.pick(r,['quantity','qty','total','amount']),10) || 1);
        const availRaw = parseInt(this.pick(r,['available','remaining','balance','in stock']),10);
        items.push({
          id:uid('i'), name, sku:expandSci(this.pick(r,['model/part no.','model','part no','sku'])),
          category: this.pick(r,['category','type','group']) || 'Other',
          description: desc,
          quantity,
          available: isNaN(availRaw) ? quantity : Math.min(quantity, Math.max(0,availRaw)),
          location: this.pick(r,['storage location','location','place','storage']),
          conditions: this.pick(r,['storage conditions','conditions']),
          serial: expandSci(this.pick(r,['serial number (s/n)','serial','s/n'])),
          certNo: expandSci(this.pick(r,['calibration certificate no.','cert no'])),
          lastCal: this.toDate(this.pick(r,['last calibration date','last cal date'])),
          nextCal: this.toDate(this.pick(r,['next calibration date','next cal date'])),
          calInterval: this.pick(r,['calibration interval','interval']),
          remarks: this.pick(r,['remarks','remark']),
          link: this.pick(r,['product link','link']),
          enabled: this.toBool(this.pick(r,['enabled','active','status']))
        });
      }
    });
    return {items, txs};
  }
};

/* ==========================================================================
   3. STATE / STORE
   ========================================================================== */
const Store = {
  state: DataLayer.load(),
  init(){
    this.state.role ||= 'borrower';
    this.state.userName ||= 'Guest User';
    this.state.invTab ||= 'items';
    this.state.filters ||= {};
    const f = this.state.filters;
    f.q ||= ''; f.category ||= 'all'; f.status ||= 'all'; f.page ||= 1;
    f.hq ||= ''; f.hstatus ||= 'all'; f.from ||= ''; f.to ||= '';
    f.layoutQ ||= '';
    f.layoutSheet ||= (EXCEL_LAYOUT[0] && EXCEL_LAYOUT[0].id) || '';
    if(!EXCEL_LAYOUT.some(s => s.id === f.layoutSheet)) f.layoutSheet = EXCEL_LAYOUT[0] ? EXCEL_LAYOUT[0].id : '';
    /* Migrate data saved before the S/N and availability fixes. */
    let fixed = false;
    this.state.items.forEach(i => {
      ['sku','serial','certNo'].forEach(k => {
        const v = expandSci(i[k]);
        if(v !== i[k]){ i[k] = v; fixed = true; }
      });
      if(/plan to purchase/i.test(String(i.location || ''))){
        i.location = 'Unavailable';
        i.enabled = false;
        i.needPurchase = true;
        fixed = true;
      }
      if(i.enabled === false && String(i.location) === 'Unavailable'){
        if(!i.needPurchase){ i.needPurchase = true; fixed = true; }
        if(Number(i.available) !== 0){ i.available = 0; fixed = true; }
      }
    });
    if(fixed) this.save();
  },
  save(){ DataLayer.save(this.state); },
  commit(msg, kind){
    this.save();
    render();
    if(msg) toast(msg, kind);
  }
};
Store.init();

const getItems = () => {
  const f = Store.state.filters, q = f.q.trim().toLowerCase();
  return Store.state.items.filter(i => {
    if(f.category !== 'all' && i.category !== f.category) return false;
    if(f.status !== 'all' && itemStatus(i) !== f.status) return false;
    if(q && !(displayName(i)+' '+i.name+' '+i.description+' '+i.category+' '+i.sku+' '+(i.location||'')).toLowerCase().includes(q)) return false;
    return true;
  });
};
const getTransactions = () => {
  const f = Store.state.filters, q = f.hq.trim().toLowerCase();
  return Store.state.transactions.filter(t => {
    if(f.hstatus === 'due'){ if(!['overdue','soon'].includes(txStatus(t))) return false; }
    else if(f.hstatus !== 'all' && txStatus(t) !== f.hstatus) return false;
    if(f.from && t.borrowDate < f.from) return false;
    if(f.to && t.borrowDate > f.to) return false;
    if(q && !(displayTxName(t)+' '+t.itemName+' '+t.borrower+' '+(t.notes||'')).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=> (b.borrowDate||'').localeCompare(a.borrowDate||''));
};

const UI = {
  kpi(cls, icon, num, label, foot){
    return `<div class="card kpi ${cls}">
      <div class="kpi-top"><div class="kpi-ico">${icon}</div></div>
      <div class="kpi-num">${num}</div><div class="kpi-label">${label}</div>
      <div class="kpi-foot">${foot}</div>
    </div>`;
  },
  itemCard(item){
    const st = itemStatus(item);
    const name = displayName(item), sku = displaySku(item);
    const borrowed = Math.max(0, (item.quantity||0) - (item.available||0));
    const isAdmin = Store.state.role === 'admin';
    const activeTxs = Store.state.transactions.filter(t => t.itemId === item.id && !t.returnDate);
    /* An item can have several active loans: prefer the current user's loan
       so the Return button stays reachable for borrowers. */
    const activeTx = isAdmin
      ? activeTxs[0]
      : activeTxs.find(t => t.borrower === Store.state.userName) || activeTxs[0];
    const canReturn = activeTx && (isAdmin || activeTx.borrower === Store.state.userName);
    return `<article class="card item-card">
      <div class="row between">
        <div class="item-ico">${ICON.box}</div>
        ${badge(st)}
      </div>
      <div>
        <div class="item-name" title="${esc(name)}">${esc(name)}</div>
        <div class="item-cat">${esc(item.category || 'Uncategorised')}${sku ? ' • '+esc(sku) : ''}</div>
      </div>
      ${item.needPurchase
        ? `<div class="item-qty"><b>0 / ${esc(item.quantity)}</b> to purchase</div>`
        : `<div class="item-qty">In stock <b>${esc(item.available)}</b> / ${esc(item.quantity)}${borrowed ? ' • '+borrowed+' on loan' : ''}</div>`}
      <div class="small muted">${item.location ? nl2br(item.location) : 'No location recorded'}</div>
      ${activeTx ? `<div class="small">Borrower: <span class="strong">${esc(activeTx.borrower)}</span> • ${esc(dueLabel(activeTx))}</div>` : ''}
      <div class="item-foot">
        ${item.enabled && item.available > 0 ? `<button class="btn primary sm" data-action="borrow" data-id="${esc(item.id)}">Borrow</button>` : ''}
        ${canReturn ? `<button class="btn ok sm" data-action="return" data-id="${esc(activeTx.id)}">Return</button>` : ''}
        <button class="btn sm" data-action="detail" data-id="${esc(item.id)}">Details</button>
      </div>
    </article>`;
  },
  txRow(tx, compact=false){
    const st = txStatus(tx);
    const canReturn = !tx.returnDate && (Store.state.role === 'admin' || tx.borrower === Store.state.userName);
    return `<tr>
      <td><div class="strong">${esc(displayTxName(tx))}</div>${!compact ? '<div class="tiny muted">'+esc(tx.notes||'')+'</div>' : ''}</td>
      ${compact ? '' : `<td>${esc(tx.borrower)}</td>`}
      <td>${esc(tx.qty)}</td>
      <td>${fmtDate(tx.borrowDate)}</td>
      <td>${fmtDate(tx.dueDate)}</td>
      <td>${tx.returnDate ? fmtDate(tx.returnDate) : '<span class="muted">—</span>'}</td>
      <td>${badge(st)}</td>
      <td>${canReturn ? `<button class="btn ok sm" data-action="return" data-id="${esc(tx.id)}">Accept return</button>` : `<button class="btn ghost sm" data-action="tx-detail" data-id="${esc(tx.id)}">View</button>`}</td>
    </tr>`;
  },
  modal(title, body, foot){
    return `<div class="backdrop" data-action="backdrop">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head"><h3 class="modal-title">${title}</h3></div>
        <div class="modal-body">${body}</div>
        ${foot ? `<div class="modal-foot">${foot}</div>` : ''}
      </div>
    </div>`;
  }
};

  items(){
    const f = Store.state.filters;
    const cats = [...new Set(Store.state.items.map(i=>i.category))].sort();
    const all = getItems();
    const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    f.page = Math.min(Math.max(1, Number(f.page) || 1), pages);
    const start = (f.page - 1) * PAGE_SIZE;
    const list = all.slice(start, start + PAGE_SIZE);

    const nums = [...new Set([1, pages, f.page-1, f.page, f.page+1])]
      .filter(p => p >= 1 && p <= pages).sort((a,b)=>a-b);
    let pageBtns = '', prev = 0;
    nums.forEach(p => {
      if(prev && p - prev > 1) pageBtns += '<span class="info">…</span>';
      pageBtns += `<button class="btn sm ${p===f.page?'current':''}" data-action="page" data-page="${p}">${p}</button>`;
      prev = p;
    });
    const pager = pages > 1 ? `<div class="pager">
      <button class="btn sm" data-action="page" data-page="${f.page-1}" ${f.page===1?'disabled':''}>‹ Prev</button>
      ${pageBtns}
      <span class="info">Page ${f.page} of ${pages}</span>
      <button class="btn sm" data-action="page" data-page="${f.page+1}" ${f.page===pages?'disabled':''}>Next ›</button>
    </div>` : '';

    return `
      <div class="page-head">
        <div><h1 class="page-title">Borrow &amp; Return</h1><p class="page-desc">Search, filter and create borrow / return records</p></div>
        ${Store.state.role==='admin' ? `<button class="btn primary" data-action="new-item">${ICON.plus} Add item</button>` : ''}

        <div class="search-box">${ICON.search}<input class="input" id="f-q" placeholder="Search name, part no., category or location..." value="${esc(f.q)}" /></div>

        <span class="small muted">${all.length} item(s) • showing ${all.length ? start+1 : 0}-${Math.min(start+PAGE_SIZE, all.length)}</span>
      </div>
      <div class="items-grid">${list.map(UI.itemCard).join('') || '<div class="card empty">'+ICON.empty+'<div>No items match your filters</div></div>'}</div>

  },

  inventory(){
    const s = Store.state, f = s.filters, isAdmin = s.role === 'admin', tab = s.invTab;
    const list = getTransactions();

    const invTable = `
      <div class="toolbar">
        <span class="small muted">${s.items.length} item(s) in inventory</span>
        <button class="btn sm" data-action="reset-data">Reset to workbook data</button>
      </div>

    const histTable = `

        <thead><tr><th>Item</th><th>Borrower</th><th>Qty</th><th>Borrowed</th><th>Due</th><th>Returned</th><th>Status</th><th></th></tr></thead>

  layout(){
    const f = Store.state.filters;
    const sheets = EXCEL_LAYOUT;
    if(!sheets.length) return '<div class="card empty">No layout sheets found in the workbook</div>';
    const sheet = sheets.find(s => s.id === f.layoutSheet) || sheets[0];
    const q = f.layoutQ.trim().toLowerCase();
    const total = sheet.blocks.reduce((n,b) => n + b.entries.length, 0);

    const tabs = sheets.map((s, idx) => {
      const count = s.blocks.reduce((n,b) => n + b.entries.length, 0);
      return `<button class="sheet-tab ${s.id===sheet.id?'active':''}" data-action="layout-sheet" data-sheet="${esc(s.id)}">
        <span class="sheet-no">${idx+1}</span>
        <span><span class="sheet-name">${esc(s.name.replace(/^RF Layout\s*/,''))}</span><span class="sheet-meta">${count} entries</span></span>
      </button>`;
    }).join('');

    let shown = 0;
    const blocks = sheet.blocks.map(b => {
      const entries = b.entries.filter(e => !q || (b.location+' '+e.part+' '+e.description+' '+e.serial).toLowerCase().includes(q));
      if(!entries.length) return '';
      shown += entries.length;
      const cards = entries.map(e => {
        const hasPart = e.part && e.part !== 'N/A';
        const match = hasPart ? Store.state.items.find(i => DataLayer.normalize(i.sku) === DataLayer.normalize(e.part)) : null;
        const chips = [
          e.qty ? `<span class="layout-chip">Qty: ${esc(e.qty)}</span>` : '<span class="layout-chip noQty">Qty not recorded</span>',
          e.serial ? `<span class="layout-chip serial">S/N: ${esc(e.serial)}</span>` : '',
          match ? `<span class="layout-chip match">In inventory</span>` : ''
        ].filter(Boolean).join('');
        return `<div class="layout-entry">
          <div class="layout-part">${hasPart ? esc(e.part) : 'Part no. N/A'}</div>
          <div class="layout-desc">${esc(e.description || e.part)}</div>
          <div class="layout-meta">${chips}</div>
        </div>`;
      }).join('');
      return `<section class="card layout-location">
        <div class="layout-loc-head">
          <div class="loc-pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-12a7 7 0 10-14 0c0 6.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></div>
          <div><div class="layout-loc-name">${esc(b.location)}</div><div class="layout-loc-meta">${entries.length} recorded item(s)</div></div>
        </div>
        <div class="layout-entries">${cards}</div>
      </section>`;
    }).filter(Boolean).join('');

    return `
      <div class="page-head">
        <div><h1 class="page-title">Storage Layout</h1><p class="page-desc">Where equipment is kept, taken from the four RF Layout sheets in the workbook</p></div>
        <span class="badge scheduled">${shown} / ${total} entries shown</span>
      </div>
      <div class="sheet-tabs">${tabs}</div>
      <div class="toolbar">
        <div class="search-box">${ICON.search}<input class="input" id="f-lq" placeholder="Search location, part no., description or S/N..." value="${esc(f.layoutQ)}" /></div>
        <span class="small muted">${esc(sheet.subtitle)}</span>
      </div>
      ${blocks || '<div class="card empty">'+ICON.empty+'<div>No layout entries match your search</div></div>'}`;
  }
};

/* --- form handlers --- */
function handleBorrow(form){
  const fd = new FormData(form);
  const item = Store.state.items.find(i=>i.id===form.dataset.id);
  if(!item) return toast('Item not found','bad');
  const borrower = String(fd.get('borrower')||'').trim();
  const qty = parseInt(fd.get('qty'),10);
  const borrowDate = fd.get('borrowDate'), dueDate = fd.get('dueDate');
  if(!borrower) return toast('Please enter the borrower name','bad');
  if(!qty || qty<1) return toast('Invalid quantity','bad');
  if(qty > item.available) return toast('Quantity exceeds stock ('+item.available+' available)','bad');
  if(!borrowDate || !dueDate) return toast('Please enter both dates','bad');
  if(dueDate < borrowDate) return toast('Due date cannot be before the borrow date','bad');
  item.available -= qty;
  Store.state.transactions.push({
    id:uid('t'), itemId:item.id, itemName:displayName(item), borrower, qty,
    borrowDate, dueDate, returnDate:null, condition:'', notes:String(fd.get('notes')||'').trim()
  });
  Store.state.userName = borrower;
  closeModal();
  Store.commit(`Borrowed "${displayName(item)}" — ${qty} unit(s)`,'ok');
}
function handleReturn(form){
  const fd = new FormData(form);
  const tx = Store.state.transactions.find(t=>t.id===form.dataset.id);
  if(!tx || tx.returnDate) return toast('Loan already returned or not found','bad');
  const returnDate = fd.get('returnDate') || todayISO();
  if(returnDate < tx.borrowDate) return toast('Return date cannot be before the borrow date','bad');
  tx.returnDate = returnDate;
  tx.condition = fd.get('condition') || 'Good';
  tx.notes = [tx.notes, String(fd.get('notes')||'').trim()].filter(Boolean).join(' | ');
  const item = Store.state.items.find(i=>i.id===tx.itemId);
  if(item) item.available = Math.min(item.quantity, (item.available||0) + Number(tx.qty||0));
  closeModal();
  Store.commit(`Returned "${displayTxName(tx)}" successfully`,'ok');
}
function handleItem(form){
  const fd = new FormData(form);
  const id = form.dataset.id;
  const name = String(fd.get('name')||'').trim();
  const quantity = parseInt(fd.get('quantity'),10);
  let available = parseInt(fd.get('available'),10);
  if(!name) return toast('Please enter an item name','bad');
  if(!quantity || quantity<1) return toast('Invalid total quantity','bad');
  if(isNaN(available) || available<0) available = 0;
  if(available > quantity) available = quantity;
  const payload = {
    name, sku:String(fd.get('sku')||'').trim(),
    category:String(fd.get('category')||'Other').trim() || 'Other',
    quantity, available, location:String(fd.get('location')||'').trim(),
    description:String(fd.get('description')||'').trim(), enabled:fd.get('enabled')==='on'
  };
  if(id){
    const item = Store.state.items.find(i=>i.id===id);
    if(!item) return;
    Object.assign(item, payload);
    Store.commit('Item updated','ok');
  }else{
    Store.state.items.push({id:uid('i'), ...payload});
    Store.commit('Item added','ok');
  }
  closeModal();
}

   7. ROUTER + EVENT DELEGATION

const ROUTES = { dashboard:'Dashboard', items:'Borrow & Return', inventory:'Inventory & History', layout:'Storage Layout' };
function currentRoute(){
  const h = location.hash.replace('#','');
  return ROUTES[h] ? h : 'dashboard';
}
function render(){
  const route = currentRoute();
  $$('.nav-link').forEach(el => el.classList.toggle('active', el.dataset.nav === route));
  $('#page-title').textContent = ROUTES[route];
  $('#view').innerHTML = Views[route]();
  const navCount = $('#nav-item-count');
  if(navCount) navCount.textContent = Store.state.items.length;
  const roleSel = $('#role-select');
  if(roleSel && document.activeElement !== roleSel) roleSel.value = Store.state.role;
  const userInp = $('#user-name');
  if(userInp && document.activeElement !== userInp) userInp.value = Store.state.userName;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action, id = el.dataset.id;

  if(act === 'backdrop'){ if(e.target === el) closeModal(); return; }
  if(act === 'close-modal'){ closeModal(); return; }
  if(act === 'borrow'){ borrowModal(id); return; }
  if(act === 'return'){ returnModal(id); return; }
  if(act === 'detail'){ detailModal(id); return; }
  if(act === 'tx-detail'){ txDetailModal(id); return; }
  if(act === 'new-item'){ itemModal(null); return; }
  if(act === 'edit-item'){ itemModal(id); return; }
  if(act === 'delete-item'){
    const item = Store.state.items.find(i=>i.id===id);
    if(!item) return;
    openModal(UI.modal('Delete item', `<p>Remove <b>${esc(displayName(item))}</b> from the inventory?<br /><span class="small muted">Loan history will be preserved.</span></p>`, `<button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="confirm-delete" data-id="${esc(id)}">Delete item</button>`));
    return;
  }
  if(act === 'confirm-delete'){
    Store.state.items = Store.state.items.filter(i=>i.id!==id);
    closeModal(); Store.commit('Item deleted','ok'); return;
  }
  if(act === 'submit-form'){
    const form = document.getElementById(el.dataset.formId);
    if(form) form.requestSubmit();
    return;
  }
  if(act === 'page'){ Store.state.filters.page = Number(el.dataset.page); Store.commit(); return; }
  if(act === 'layout-sheet'){ Store.state.filters.layoutSheet = el.dataset.sheet; Store.commit(); return; }
  if(act === 'inv-tab'){ Store.state.invTab = el.dataset.tab; Store.commit(); return; }
  if(act === 'import-csv'){ $('#csv-input').click(); return; }
  if(act === 'reset-data'){
    openModal(UI.modal('Reset data', '<p>Replace all current data with the original workbook inventory?<br /><span class="small muted">Loan records will be cleared. This cannot be undone.</span></p>', `<button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="confirm-reset">Reset</button>`));
    return;
  }
  if(act === 'confirm-reset'){
    const role = Store.state.role, userName = Store.state.userName;
    Store.state = seedState(); Store.state.role = role; Store.state.userName = userName;
    Store.init(); closeModal(); Store.commit('Restored the workbook inventory','ok'); return;
  }
  if(act === 'confirm-import'){
    const res = $('#modal-root')._pendingImport;
    if(!res) return;
    Store.state.items = res.items; Store.state.transactions = res.txs;
    Store.init(); closeModal();
    Store.commit(`Imported ${res.items} item(s) and ${res.txs} loan record(s)`,'ok');
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  if(form.dataset.form === 'borrow') handleBorrow(form);
  else if(form.dataset.form === 'return') handleReturn(form);
  else if(form.dataset.form === 'item') handleItem(form);
});

let filterTimer;
document.addEventListener('input', (e) => {
  const t = e.target;
  if(!['f-q','f-hq','f-lq'].includes(t.id)) return;
  clearTimeout(filterTimer);
  const key = t.id === 'f-q' ? 'q' : (t.id === 'f-hq' ? 'hq' : 'layoutQ');
  const val = t.value;
  filterTimer = setTimeout(() => {
    Store.state.filters[key] = val;
    Store.state.filters.page = 1;
    Store.save();
    const pos = t.selectionStart;
    render();
    const next = document.getElementById(t.id);
    if(next){ next.focus(); try{ next.setSelectionRange(pos,pos); }catch(_){} }
  }, 220);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if(t.id === 'f-category'){ Store.state.filters.category = t.value; Store.state.filters.page = 1; Store.commit(); }
  else if(t.id === 'f-status'){ Store.state.filters.status = t.value; Store.state.filters.page = 1; Store.commit(); }
  else if(t.id === 'f-hstatus'){ Store.state.filters.hstatus = t.value; Store.commit(); }
  else if(t.id === 'f-from'){ Store.state.filters.from = t.value; Store.commit(); }
  else if(t.id === 'f-to'){ Store.state.filters.to = t.value; Store.commit(); }
  else if(t.id === 'role-select'){ Store.state.role = t.value; Store.commit('Role changed to '+ROLE_LABEL[t.value]); }
  else if(t.id === 'user-name'){ Store.state.userName = t.value; Store.commit(); }
});
const ROLE_LABEL = { borrower:'Borrower', admin:'Admin' };
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
});
$('#csv-input').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const res = DataLayer.importCSV(text);
    if(!res.items && !res.txs) return toast('No readable data found in this file','bad');
    openModal(UI.modal('Import CSV data', `<p>Found <b>${res.items}</b> inventory item(s) and <b>${res.txs}</b> loan record(s).</p><p class="small muted">Replace the current data with the imported data?</p>`, `<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-import">Replace data</button>`));
    $('#modal-root')._pendingImport = res;
  }catch(err){ toast('Could not read file: '+err.message,'bad'); }
  e.target.value = '';
});

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
